name: release-windows-portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm install

      - name: Build portable exe (no installer, no signature needed)
        working-directory: apps/desktop
        run: npm run tauri:build -- --no-bundle

      - name: Package portable zip
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "target/release/whisperpro-desktop.exe" "portable/WhisperPro.exe"
          Compress-Archive -Path "portable/WhisperPro.exe" -DestinationPath "WhisperPro-$ver-portable.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WhisperPro-*-portable.zip
          generate_release_notes: false
          body: |
            WhisperPro for Windows (portable build).

            Extract the zip and run `WhisperPro.exe`, or install with Scoop / npm when available.
